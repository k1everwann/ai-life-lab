<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; connect-src 'none'; form-action 'none'; base-uri 'none'"><title>Checklist: debugging exercise</title><style>body{font:16px/1.7 system-ui,sans-serif;max-width:700px;margin:auto;padding:24px;color:#202124}h1{font-size:26px}[hidden]{display:none!important}label{display:flex;gap:12px;align-items:center;padding:12px 0}input{width:22px;height:22px}button{font:inherit;padding:10px 16px;background:white;border:1px solid #2458a6;min-height:44px}:focus-visible{outline:2px solid #2458a6;outline-offset:3px}</style></head><body><h1>Checklist: debugging exercise</h1><p>Fictional teaching file. Ticks reset on refresh. Reference fix: reset clears all tasks, including hidden ones.</p><label for="search">Search tasks</label><input id="search" type="search" autocomplete="off"><p role="status" aria-live="polite">Completed <strong id="count">0</strong> / 3</p><label><input type="checkbox"><span>Download tickets</span></label><label><input type="checkbox"><span>Confirm meeting location</span></label><label><input type="checkbox"><span>Bring a water bottle</span></label><button type="button" id="reset">Reset all</button><script>(()=>{const boxes=[...document.querySelectorAll("input[type=checkbox]")];const count=document.getElementById("count");const search=document.getElementById("search");function update(){count.textContent=boxes.filter(b=>b.checked).length;}function filter(){boxes.forEach(b=>{b.parentElement.hidden=!b.parentElement.textContent.toLowerCase().includes(search.value.toLowerCase());});}boxes.forEach(b=>b.addEventListener("change",update));search.addEventListener("input",filter);document.getElementById("reset").addEventListener("click",()=>{boxes.forEach(b=>{b.checked=false;});search.value="";filter();update();});function init(){boxes.forEach(b=>{b.checked=false;});search.value="";filter();update();}window.addEventListener("pageshow",init);init();})();</script></body></html>
