<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; connect-src 'none'; form-action 'none'; base-uri 'none'"><title>清單：除錯練習</title><style>body{font:16px/1.7 system-ui,sans-serif;max-width:700px;margin:auto;padding:24px;color:#202124}h1{font-size:26px}label{display:flex;gap:12px;align-items:center;padding:12px 0}input{width:22px;height:22px}button{font:inherit;padding:10px 16px;background:white;border:1px solid #2458a6;min-height:44px}:focus-visible{outline:2px solid #2458a6;outline-offset:3px}</style></head><body><h1>清單：除錯練習</h1><p>虛構教學檔案；重新整理不保留勾選。參考修正版：計入所有勾選項目。</p><p role="status" aria-live="polite">已完成 <strong id="count">0</strong> / 3</p><label><input type="checkbox"><span>下載車票</span></label><label><input type="checkbox"><span>確認集合地點</span></label><label><input type="checkbox"><span>帶水壺</span></label><button type="button" id="reset">全部重設</button><script>(()=>{const boxes=[...document.querySelectorAll("input[type=checkbox]")];const count=document.getElementById("count");function update(){count.textContent=boxes.filter(box=>box.checked).length;}boxes.forEach(box=>box.addEventListener("change",update));document.getElementById("reset").addEventListener("click",()=>{boxes.forEach(box=>{box.checked=false;});update();});function init(){boxes.forEach(box=>{box.checked=false;});update();}window.addEventListener("pageshow",init);init();})();</script></body></html>
