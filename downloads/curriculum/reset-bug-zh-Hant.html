<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; connect-src 'none'; form-action 'none'; base-uri 'none'"><title>讀書準備清單：重設故障版</title><style>body{font:16px/1.7 system-ui,sans-serif;max-width:700px;margin:auto;padding:24px;color:#202124}h1{font-size:26px}label{display:flex;gap:12px;align-items:center;padding:12px 0}input{width:22px;height:22px}button{font:inherit;padding:10px 16px;background:white;border:1px solid #2458a6;min-height:44px}:focus-visible{outline:2px solid #2458a6;outline-offset:3px}</style></head><body><h1>讀書準備清單：重設故障版</h1><p>虛構教學檔案；重新整理不保留勾選。刻意保留重設錯誤：勾兩項再重設，計數沒有更新。</p><p role="status" aria-live="polite">已完成 <strong id="count">0</strong> / 2</p><label><input type="checkbox"><span>選一篇文章</span></label><label><input type="checkbox"><span>寫三個問題</span></label><button type="button" id="reset">全部重設</button><script>(()=>{const boxes=[...document.querySelectorAll("input[type=checkbox]")];const count=document.getElementById("count");function updateCount(){count.textContent=boxes.filter(box=>box.checked).length;}boxes.forEach(box=>box.addEventListener("change",updateCount));document.getElementById("reset").addEventListener("click",()=>{boxes.forEach(box=>{box.checked=false;});});function init(){boxes.forEach(box=>{box.checked=false;});updateCount();}window.addEventListener("pageshow",init);init();})();</script></body></html>
