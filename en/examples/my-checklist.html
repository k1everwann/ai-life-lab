<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>My travel preparation checklist</title><style>
*{box-sizing:border-box}body{margin:0;padding:35px 18px;background:#f6f7f8;color:#202124;font-family:system-ui,sans-serif;line-height:1.8}main{max-width:580px;margin:auto;background:#ffffff;padding:30px;border-radius:3px;border:1px solid #dfe3e8}small{font-size:12px;letter-spacing:1px;color:#626973}h1{font-size:28px;line-height:1.4;margin:10px 0 15px}p{color:#525963}label{display:flex;align-items:center;gap:14px;min-height:58px;border-bottom:1px solid #e4e7eb;cursor:pointer}input{width:22px;height:22px;accent-color:#2458a6;flex-shrink:0}input:checked+span{text-decoration:line-through;color:#7b818a}button{font:inherit;background:#2458a6;color:white;border:0;border-radius:3px;min-height:46px;padding:10px 20px;cursor:pointer;margin-top:15px}button:focus-visible,input:focus-visible,a:focus-visible{outline:3px solid #2458a6;outline-offset:4px}#count{font-weight:700;color:#2458a6}footer{font-size:12px;color:#626973;margin-top:24px}.example-languages{max-width:580px;margin:0 auto 18px;display:flex;flex-wrap:wrap;gap:18px}.example-languages a{color:#2458a6;min-height:44px;display:inline-flex;align-items:center}@media(max-width:420px){main{padding:22px}h1{font-size:26px}}
</style></head><body><nav class="example-languages" aria-label="Language and course"><a href="https://k1everwann.github.io/ai-life-lab/examples/my-checklist.html" data-language-switch="zh-Hant" lang="zh-Hant">繁體中文</a><a href="https://k1everwann.github.io/ai-life-lab/en/examples/my-checklist.html" data-language-switch="en" aria-current="page">English</a><a href="https://k1everwann.github.io/ai-life-lab/en/?route=computer#classroom">Back to course</a></nav><main><small>MY FIRST WEBPAGE</small><h1>My travel preparation checklist</h1><p>Quickly check that I have packed everything before leaving.</p><p id="count" aria-live="polite">Completed 0 / 4 items</p><div id="items"><label><input type="checkbox"><span>Confirm transport</span></label><label><input type="checkbox"><span>Prepare rain gear</span></label><label><input type="checkbox"><span>Bring a water bottle</span></label><label><input type="checkbox"><span>Check charging cables</span></label></div><button id="reset" type="button">Reset all</button><footer>This is a single-file webpage exercise. It does not keep checked progress after a refresh or closing the page.</footer></main><script>
const checks=[...document.querySelectorAll('input[type="checkbox"]')];
function update(){document.getElementById("count").textContent="Completed "+checks.filter(x=>x.checked).length+" / "+checks.length+" items";}
checks.forEach(x=>x.addEventListener("change",update));
document.getElementById("reset").addEventListener("click",()=>{checks.forEach(x=>x.checked=false);update();});
update();
</script></body></html>
